services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apply_pilot
      POSTGRES_USER: apply_pilot
      POSTGRES_PASSWORD: apply_pilot_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apply_pilot -d apply_pilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
